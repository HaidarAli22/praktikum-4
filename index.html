<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Scanner - Object Detection</title>

    <style>
      :root {
        --green: #00d978;
        --dark: #050505;
        --gray: #191919;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
      }

      /* CAMERA */
      #camera-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
      }

      /* HEADER */
      .top-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 70px;
        z-index: 20;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 16px;

        background: linear-gradient(#000b, transparent);
        pointer-events: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;

        font-size: 17px;
        font-weight: 700;
      }

      .ai-badge {
        width: 30px;
        height: 25px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 6px;
        background: #00cfff;
        color: #00151a;

        font-weight: 800;
      }

      .demo-badge {
        display: flex;
        align-items: center;
        gap: 7px;

        padding: 6px 11px;
        border-radius: 15px;

        background: #555c;

        font-size: 11px;
        font-weight: 700;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffc400;
      }

      /* SIDE MENU */
      .right-menu {
        position: fixed;
        top: 158px;
        right: 12px;
        z-index: 25;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 13px;
      }

      .side-button {
        width: 50px;
        padding: 0;

        border: 0;
        background: transparent;
        color: #fff;

        cursor: pointer;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .side-icon {
        width: 46px;
        height: 46px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        background: #191919dc;

        font-size: 20px;

        transition: 0.2s;
      }

      .side-button.active .side-icon {
        background: var(--green);
        box-shadow: 0 0 15px #00d978aa;
      }

      .side-button span {
        font-size: 10px;
        text-shadow: 0 1px 4px #000;
      }

      /* DETECTION RESULT */
      .detection-result {
        position: fixed;
        left: 20px;
        bottom: 82px;
        z-index: 10;

        pointer-events: none;
        text-shadow: 0 2px 5px #000;
      }

      .detection-result h2 {
        margin: 0 0 6px;
        font-size: 26px;
      }

      .detection-result p {
        margin: 0 0 8px;

        font-size: 12px;
        color: #ddd;
      }

      .confidence {
        display: inline-block;

        padding: 5px 12px;
        border-radius: 15px;

        background: #00d9782e;
        border: 1px solid var(--green);

        color: #00e98a;

        font-size: 11px;
        font-weight: 700;
      }

      /* LOG DATA */
      #data-section {
        position: fixed;
        left: 50%;
        bottom: 84px;

        transform: translateX(-50%);

        z-index: 40;

        width: min(520px, calc(100% - 30px));
        max-height: 52vh;

        background: #050505f5;
        border: 1px solid #333;
        border-radius: 14px;

        overflow: hidden;
        display: none;
      }

      #data-header {
        padding: 12px 16px;

        display: flex;
        justify-content: space-between;

        border-bottom: 1px solid #333;
        background: #111;

        font-size: 13px;
        font-weight: 700;
      }

      #data-list {
        max-height: calc(52vh - 50px);

        overflow-y: auto;
        padding: 8px;
      }

      .log-item {
        padding: 10px 12px;

        margin-bottom: 8px;

        background: #111;
        border: 1px solid #262626;
        border-left: 4px solid var(--green);
        border-radius: 8px;

        font-size: 13px;
      }

      .log-item .time {
        display: block;

        margin-bottom: 4px;

        color: #a3a3a3;
        font-size: 11px;
      }

      .empty-state {
        padding: 25px;

        text-align: center;

        color: #a3a3a3;
        font-size: 13px;
      }

      /* BOTTOM NAVIGATION */
      .bottom-navigation {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;

        height: 74px;

        z-index: 30;

        display: flex;
        align-items: center;
        justify-content: space-around;

        background: #000f;
        border-top: 1px solid #ffffff0a;
      }

      .bottom-item {
        min-width: 100px;

        border: 0;
        background: transparent;
        color: #fff;

        cursor: pointer;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }

      .bottom-icon {
        font-size: 21px;
      }

      .bottom-item span {
        font-size: 10px;
      }

      .log-icon-wrapper {
        position: relative;
      }

      .log-count {
        position: absolute;

        top: -9px;
        right: -11px;

        min-width: 23px;
        height: 20px;

        padding: 0 5px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: #ff3b30;
        color: #fff;

        font-size: 10px;
        font-weight: 800;
      }

      /* OVERLAY */
      #overlay-msg {
        position: absolute;
        inset: 0;

        z-index: 15;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background: #000c;
        color: #fff;

        text-align: center;
      }

      #overlay-text {
        font-size: 14px;
      }

      .spinner {
        width: 38px;
        height: 38px;

        margin-bottom: 10px;

        border: 4px solid #fff3;
        border-top-color: #fff;
        border-radius: 50%;

        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .legacy-controls {
        display: none;
      }

      /* RESPONSIVE */
      @media (max-width: 600px) {
        .right-menu {
          top: 125px;
          right: 8px;
        }

        .side-icon {
          width: 43px;
          height: 43px;
        }

        .detection-result {
          left: 20px;
          bottom: 84px;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header class="top-header">
      <div class="brand">
        <span class="ai-badge">AI</span>
        <span>Scanner</span>
      </div>

      <div class="demo-badge">
        <span class="status-dot"></span>
        DEMO
      </div>
    </header>

    <!-- CAMERA -->
    <div id="camera-container">
      <video id="video" autoplay playsinline muted></video>

      <canvas id="canvas"></canvas>

      <div id="overlay-msg">
        <div class="spinner"></div>
        <p id="overlay-text">Memulai Sistem...</p>
      </div>
    </div>

    <!-- SIDE MENU -->
    <aside class="right-menu">
      <button id="sideCamera" class="side-button">
        <div class="side-icon">📷</div>
        <span>Kamera</span>
      </button>

      <button id="sideSwitch" class="side-button">
        <div class="side-icon">🔄</div>
        <span>Switch</span>
      </button>

      <button id="sideAI" class="side-button">
        <div class="side-icon">⚙️</div>
        <span>AI Scan</span>
      </button>

      <button id="sideFlash" class="side-button">
        <div class="side-icon">⚡</div>
        <span>Flash</span>
      </button>
    </aside>

    <!-- DETECTION RESULT -->
    <div class="detection-result">
      <h2 id="detection-main">Siap Scan</h2>

      <p id="detection-info">Tekan tombol Kamera untuk memulai</p>

      <div id="detection-badges"></div>
    </div>

    <!-- LOG DATA -->
    <div id="data-section">
      <div id="data-header">
        <span>Detected Objects Log</span>
        <span id="log-count">0 items</span>
      </div>

      <div id="data-list">
        <div class="empty-state">Menunggu deteksi objek...</div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation">
      <button id="navScanner" class="bottom-item">
        <div class="bottom-icon">🏠</div>

        <span> Scanner </span>
      </button>

      <button id="navLog" class="bottom-item">
        <div class="log-icon-wrapper">
          <span class="log-count" id="navLogCount"> 0 </span>

          <div class="bottom-icon">📋</div>
        </div>

        <span> Log Data </span>
      </button>
    </nav>

    <!-- LIBRARY -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

    <script>
      /* FIREBASE SETUP */

      const firebaseConfig = {
        apiKey: "AIzaSyAcBrtwzjTeW5vjGknSCkYrb-o2MxQbJGo",
        authDomain: "praktikum-4-121d1.firebaseapp.com",
        projectId: "praktikum-4-121d1",
        storageBucket: "praktikum-4-121d1.firebasestorage.app",
        messagingSenderId: "111527697440",
        appId: "1:111527697440:web:a652fd29b8021336d7b045",
      };

      /* MOCK FIRESTORE */

      class MockFirestore {
        constructor() {
          this.data = JSON.parse(
            localStorage.getItem("mock_inventory_db") || "[]",
          );

          this.listeners = [];
        }

        collection() {
          return this;
        }

        async add(payload) {
          const doc = {
            ...payload,

            id: Date.now().toString(),

            timestamp: {
              toDate: () => new Date(),
            },
          };

          this.data.unshift(doc);

          if (this.data.length > 50) {
            this.data.pop();
          }

          localStorage.setItem("mock_inventory_db", JSON.stringify(this.data));

          this.listeners.forEach((callback) => {
            callback(this.data);
          });

          return Promise.resolve();
        }

        orderBy() {
          return this;
        }

        limit() {
          return this;
        }

        onSnapshot(callback) {
          this.listeners.push(callback);

          callback(this.data);

          return () => {};
        }
      }

      /* INITIALIZE FIREBASE */

      let db;
      let isMockMode = true;

      if (firebaseConfig.apiKey && firebaseConfig.projectId) {
        try {
          firebase.initializeApp(firebaseConfig);

          db = firebase.firestore();

          isMockMode = false;

          console.log("Firebase berhasil diinisialisasi.");
        } catch (error) {
          console.error("Firebase init error:", error);

          console.log("Menggunakan Mock Mode.");

          db = new MockFirestore();
        }
      } else {
        db = new MockFirestore();
      }

      /* DATABASE */

      const collectionRef = db.collection("inventory_logs");

      /* DOM ELEMENTS */

      const video = document.getElementById("video");

      const canvas = document.getElementById("canvas");

      const ctx = canvas.getContext("2d");

      const sideCamera = document.getElementById("sideCamera");

      const sideSwitch = document.getElementById("sideSwitch");

      const sideAI = document.getElementById("sideAI");

      const sideFlash = document.getElementById("sideFlash");

      const navLog = document.getElementById("navLog");

      const navScanner = document.getElementById("navScanner");

      const dataSection = document.getElementById("data-section");

      /* APPLICATION STATE */

      let isCameraOn = false;
      let isAIDetecting = false;
      let model = null;

      let lastSaveTime = 0;

      const SAVE_THROTTLE_MS = 3000;

      /* OVERLAY */

      function showOverlay(title, text) {
        const overlay = document.getElementById("overlay-msg");

        const overlayText = document.getElementById("overlay-text");

        overlayText.textContent = title + " " + text;

        overlay.style.display = "flex";
      }

      function hideOverlay() {
        document.getElementById("overlay-msg").style.display = "none";
      }

      /* CAMERA */

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment",
              width: { ideal: 1280 },
              height: { ideal: 720 },
            },

            audio: false,
          });

          video.srcObject = stream;

          await new Promise((resolve) => {
            video.onloadedmetadata = () => {
              console.log(
                "Resolusi kamera:",
                video.videoWidth,
                "x",
                video.videoHeight,
              );

              canvas.width = video.videoWidth;

              canvas.height = video.videoHeight;

              resolve();
            };
          });

          isCameraOn = true;

          sideCamera.classList.add("active");

          updateDetectionUI([]);

          showOverlay("Memuat Model AI...", "Mohon tunggu.");

          await loadModel();

          isAIDetecting = false;
        } catch (error) {
          console.error("Gagal mengakses kamera:", error);

          alert("Akses kamera ditolak. Pastikan izin kamera diizinkan.");

          isCameraOn = false;
        }
      }

      function stopCamera() {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach((track) => {
            track.stop();
          });

          video.srcObject = null;
        }

        isCameraOn = false;

        isAIDetecting = false;

        resetStability();

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        sideCamera.classList.remove("active");

        sideAI.classList.remove("active");

        updateDetectionUI([]);

        hideOverlay();

        console.log("Kamera berhasil dimatikan.");
      }

      /* AI MODEL */

      async function loadModel() {
        try {
          model = await cocoSsd.load({
            base: "mobilenet_v2",
          });

          hideOverlay();

          console.log("Model AI berhasil dimuat.");
        } catch (error) {
          console.error("Gagal memuat model:", error);

          showOverlay("Gagal Memuat Model AI.", "Periksa koneksi internet.");
        }
      }

      /* DETECTION CONFIG */

      const TARGET_CLASSES = [
        "person",
        "laptop",
        "cell phone",
        "mouse",
        "keyboard",
        "book",
        "clock",
        "scissors",
        "pen",
        "remote",
        "tvmonitor",
        "bottle",
        "cup",
      ];

      const CONFIDENCE_THRESHOLD = 0.6;

      const STABILITY_WINDOW = 6;

      const STABILITY_MIN_HITS = 4;

      let detHistory = new Map();

      /* DETECTION STABILITY */

      function resetStability() {
        detHistory = new Map();
      }

      function registerFrame(predictions) {
        const frameScores = new Map();

        predictions.forEach((prediction) => {
          if (!TARGET_CLASSES.includes(prediction.class)) {
            return;
          }

          const current = frameScores.get(prediction.class) || 0;

          if (prediction.score > current) {
            frameScores.set(prediction.class, prediction.score);
          }
        });

        TARGET_CLASSES.forEach((className) => {
          const history = detHistory.get(className) || [];

          history.push(frameScores.get(className) || 0);

          while (history.length > STABILITY_WINDOW) {
            history.shift();
          }

          detHistory.set(className, history);
        });
      }

      function computeStable() {
        const stableSet = new Set();

        const stableMax = new Map();

        detHistory.forEach((history, className) => {
          const hits = history.filter(
            (score) => score > CONFIDENCE_THRESHOLD,
          ).length;

          if (hits >= STABILITY_MIN_HITS) {
            stableSet.add(className);

            stableMax.set(className, Math.max(...history));
          }
        });

        return {
          stableSet,
          stableMax,
        };
      }

      /* DETECTION LOOP */

      async function detectLoop() {
        if (!isAIDetecting || !isCameraOn || !model) {
          return;
        }

        const predictions = await model.detect(video);

        registerFrame(predictions);

        const { stableSet, stableMax } = computeStable();

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const detectedTargets = [];

        const savedClasses = new Set();

        predictions.forEach((prediction) => {
          const [x, y, width, height] = prediction.bbox;

          const isTarget = TARGET_CLASSES.includes(prediction.class);

          const confidence = prediction.score;

          const isStable = isTarget && stableSet.has(prediction.class);

          if (isStable) {
            ctx.strokeStyle = "#00d978";

            ctx.lineWidth = 3;

            ctx.strokeRect(x, y, width, height);

            const label = `${prediction.class} ${(confidence * 100).toFixed(0)}%`;

            ctx.font = "bold 14px sans-serif";

            const textWidth = ctx.measureText(label).width;

            ctx.fillStyle = "#00d978";

            ctx.fillRect(x, y - 25, textWidth + 10, 25);

            ctx.fillStyle = "#000";

            ctx.fillText(label, x + 5, y - 7);

            if (!savedClasses.has(prediction.class)) {
              savedClasses.add(prediction.class);

              detectedTargets.push({
                class: prediction.class,

                confidence: parseFloat(
                  (stableMax.get(prediction.class) * 100).toFixed(2),
                ),
              });
            }
          } else if (isTarget) {
            ctx.strokeStyle = "#a3a3a3";

            ctx.lineWidth = 2;

            ctx.strokeRect(x, y, width, height);
          } else {
            ctx.strokeStyle = "#525252";

            ctx.lineWidth = 1;

            ctx.strokeRect(x, y, width, height);
          }
        });

        updateDetectionUI(detectedTargets);

        if (
          detectedTargets.length > 0 &&
          Date.now() - lastSaveTime > SAVE_THROTTLE_MS
        ) {
          await saveToDatabase(detectedTargets);

          lastSaveTime = Date.now();
        }

        requestAnimationFrame(detectLoop);
      }

      /* DETECTION UI */

      function updateDetectionUI(targets) {
        const main = document.getElementById("detection-main");

        const info = document.getElementById("detection-info");

        const badges = document.getElementById("detection-badges");

        if (targets.length === 0) {
          if (isCameraOn && !isAIDetecting) {
            main.textContent = "Model Siap";

            info.textContent = "Tekan tombol AI Scan untuk mulai deteksi";
          } else if (!isCameraOn) {
            main.textContent = "Siap Scan";

            info.textContent = "Tekan tombol Kamera untuk memulai";
          } else {
            main.textContent = "Scanning...";

            info.textContent = "Mencari objek...";
          }

          badges.innerHTML = "";

          return;
        }

        const first = targets[0];

        main.textContent = first.class;

        info.textContent = `Terdeteksi ${targets.length} objek • Confidence ${first.confidence}%`;

        badges.innerHTML = targets
          .map(
            (target) => `
              <span class="confidence">
                ${target.class} • ${target.confidence}%
              </span>
            `,
          )
          .join("");
      }

      /* SAVE DATABASE */

      async function saveToDatabase(data) {
        try {
          const itemsString = data
            .map((item) => `${item.class} (${item.confidence}%)`)
            .join(", ");

          const payload = {
            items: itemsString,

            count: data.length,

            device_id: "BROWSER-TEST",

            timestamp: isMockMode
              ? new Date().toISOString()
              : firebase.firestore.FieldValue.serverTimestamp(),
          };

          await collectionRef.add(payload);

          console.log("Data berhasil disimpan:", payload);

          updateLogBadge();
        } catch (error) {
          console.error("Gagal menyimpan data:", error);
        }
      }

      /* LOG BADGE */

      function updateLogBadge(count = null) {
        const badge = document.getElementById("navLogCount");

        if (count !== null) {
          badge.textContent = count;

          return;
        }

        if (isMockMode && db.data) {
          badge.textContent = db.data.length;
        }
      }

      /* DATABASE LISTENER */

      function listenToDatabase() {
        try {
          collectionRef
            .orderBy("timestamp", "desc")
            .limit(30)
            .onSnapshot(
              (snapshot) => {
                const dataList = document.getElementById("data-list");

                dataList.innerHTML = "";

                let count = 0;

                const docs = isMockMode ? snapshot : snapshot.docs;

                if (!docs) {
                  console.warn("Snapshot kosong.");

                  return;
                }

                docs.forEach((doc) => {
                  count++;

                  const data = isMockMode ? doc : doc.data();

                  let timeString = "Baru saja";

                  if (data.timestamp) {
                    try {
                      const date = isMockMode
                        ? new Date(data.timestamp)
                        : data.timestamp.toDate();

                      timeString = date.toLocaleTimeString("id-ID");
                    } catch (error) {
                      console.log("Timestamp belum tersedia.");
                    }
                  }

                  const logItem = document.createElement("div");

                  logItem.className = "log-item";

                  logItem.innerHTML = `
                    <span class="time">
                      ${timeString}
                    </span>

                    <span class="items">
                      ${data.items}
                    </span>
                  `;

                  dataList.appendChild(logItem);
                });

                /* UPDATE JUMLAH LOG */

                document.getElementById("log-count").textContent =
                  `${count} items`;

                /* UPDATE BADGE */

                updateLogBadge(count);

                if (count === 0) {
                  dataList.innerHTML = `
                  <div class="empty-state">
                    Belum ada objek terdeteksi
                  </div>
                `;
                }

                console.log(`Jumlah log: ${count}`);
              },

              (error) => {
                console.error("Error membaca database:", error);
              },
            );
        } catch (error) {
          console.error("Setup listener error:", error);
        }
      }

      /* CAMERA BUTTON */

      sideCamera.addEventListener("click", () => {
        if (!isCameraOn) {
          sideCamera.classList.add("active");

          startCamera();
        } else {
          stopCamera();
        }
      });

      /* AI BUTTON */

      sideAI.addEventListener("click", () => {
        if (!isCameraOn) {
          alert("Nyalakan kamera terlebih dahulu!");

          return;
        }

        if (!model) {
          alert("Model AI masih dimuat.");

          return;
        }

        if (!isAIDetecting) {
          isAIDetecting = true;

          sideAI.classList.add("active");

          resetStability();

          detectLoop();
        } else {
          isAIDetecting = false;

          sideAI.classList.remove("active");

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          updateDetectionUI([]);
        }
      });

      /* SWITCH CAMERA */

      sideSwitch.addEventListener("click", async () => {
        alert(
          "Fitur Switch kamera dapat ditambahkan jika perangkat memiliki kamera depan dan belakang.",
        );
      });

      /* FLASH */

      sideFlash.addEventListener("click", () => {
        alert(
          "Flash bergantung pada dukungan torch dari perangkat dan browser.",
        );
      });

      /* LOG NAVIGATION */

      navLog.addEventListener("click", () => {
        if (dataSection.style.display === "block") {
          dataSection.style.display = "none";
        } else {
          dataSection.style.display = "block";
        }
      });

      /* SCANNER NAVIGATION */

      navScanner.addEventListener("click", () => {
        dataSection.style.display = "none";
      });

      /* DOM READY */

      document.addEventListener("DOMContentLoaded", () => {
        console.log("Aplikasi AI Scanner dimulai.");

        console.log("Mode:", isMockMode ? "Mock Mode" : "Firebase");

        listenToDatabase();

        console.log("Aplikasi siap digunakan.");
      });
    </script>
  </body>
</html>
